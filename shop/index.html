<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>vincent leathercraft — catalog</title>
  <style>
    @font-face {
      font-family: "DINNextRoundedLTW01-Regular";
      src: url("/DINfont.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg-color: #fafafa;
      --text-color: #111111;
      --subtext-color: #666666;
      --border-color: #e5e5e5;
      --card-bg: #ffffff;
      --info-bg: #f0f0f0;
      --info-text: #444444;
      --btn-bg: #f4f4f4;
      --btn-text: #111111;
      --btn-border: #dddddd;
      --accent-bg: #000000;
      --accent-text: #ffffff;
      --shadow-color: rgba(0, 0, 0, 0.08);
      --main-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    [data-lang="en"] {
      --main-font: "DINNextRoundedLTW01-Regular", -apple-system, BlinkMacSystemFont, sans-serif;
    }

    [data-theme="dark"] {
      --bg-color: #121212;
      --text-color: #f0f0f0;
      --subtext-color: #a0a0a0;
      --border-color: #2a2a2a;
      --card-bg: #1e1e1e;
      --info-bg: #222222;
      --info-text: #cccccc;
      --btn-bg: #2a2a2a;
      --btn-text: #ffffff;
      --btn-border: #444444;
      --accent-bg: #ffffff;
      --accent-text: #000000;
      --shadow-color: rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease;
    }

    /* Lowercase applied to UI elements, excluding user-copyable content */
    body,
    h1, h2, p, label, button, a, strong, span, div {
      text-transform: lowercase;
    }
    .keep-case {
      text-transform: none;
    }

    body {
      font-family: var(--main-font);
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 40px 20px;
      line-height: 1.6;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
    }

    .top-bar {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-bottom: 20px;
    }

    .control-btn {
      font-family: inherit;
      background: var(--btn-bg);
      color: var(--text-color);
      border: 1px solid var(--btn-border);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    header {
      margin-bottom: 32px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 16px;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .subtext {
      color: var(--subtext-color);
      font-size: 0.95rem;
      margin-top: 4px;
    }

    .info-box {
      background: var(--info-bg);
      padding: 14px 18px;
      border-radius: 8px;
      font-size: 0.9rem;
      color: var(--info-text);
      margin-bottom: 32px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 28px;
      margin-bottom: 36px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      user-select: none;
    }

    .card.selected {
      border-color: var(--text-color);
      box-shadow: 0 0 0 2px var(--text-color);
    }

    .card img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      display: block;
      background-color: var(--btn-bg);
    }

    .card-content {
      padding: 16px 20px;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .card-desc {
      color: var(--subtext-color);
      font-size: 0.9rem;
      margin-top: 4px;
    }

    .card-price {
      font-weight: 700;
      margin-top: 8px;
      font-size: 1rem;
    }

    .select-btn {
      font-family: inherit;
      margin-top: 12px;
      width: 100%;
      padding: 10px;
      background: var(--btn-bg);
      color: var(--btn-text);
      border: 1px solid var(--btn-border);
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }

    .card.selected .select-btn {
      background: var(--accent-bg);
      color: var(--accent-text);
      border-color: var(--accent-bg);
    }

    .action-panel {
      position: sticky;
      bottom: 20px;
      background: var(--card-bg);
      border: 1px solid var(--text-color);
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 10px 25px var(--shadow-color);
      margin-bottom: 48px;
    }

    .order-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      gap: 12px;
    }

    .order-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--subtext-color);
    }

    .total-badge {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-color);
      white-space: nowrap;
    }

    .order-textarea {
      width: 100%;
      height: 110px;
      font-family: inherit;
      font-size: 0.9rem;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--btn-bg);
      color: var(--text-color);
      resize: none;
      margin-bottom: 12px;
      outline: none;
      text-transform: none;
    }

    .button-group {
      display: flex;
      gap: 10px;
    }

    .btn-copy {
      flex: 1;
      font-family: inherit;
      background: var(--btn-bg);
      color: var(--text-color);
      border: 1px solid var(--btn-border);
      padding: 12px 0;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      text-align: center;
    }

    .btn-threads {
      flex: 2;
      font-family: inherit;
      display: inline-block;
      background: var(--accent-bg);
      color: var(--accent-text);
      text-decoration: none;
      padding: 12px 0;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      text-align: center;
    }

    .payment-section {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      margin-bottom: 40px;
    }

    .payment-section h2 {
      font-size: 1.2rem;
      margin-bottom: 6px;
    }

    .payment-section > p {
      font-size: 0.9rem;
      color: var(--subtext-color);
      margin-bottom: 16px;
    }

    .qr-container img {
      width: 300px;
      height: 300px;
      max-width: 100%;
      object-fit: contain;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: #fff;
      padding: 8px;
      margin-bottom: 16px;
    }

    .bank-details {
      font-size: 0.95rem;
      line-height: 1.8;
      background: var(--info-bg);
      padding: 12px 16px;
      border-radius: 8px;
      display: inline-block;
      text-align: left;
    }

    .copy-small-btn {
      font-family: inherit;
      background: var(--btn-bg);
      color: var(--text-color);
      border: 1px solid var(--btn-border);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      margin-left: 6px;
      display: inline-block;
      vertical-align: middle;
    }

    .account-number {
      text-transform: none;
    }

    footer {
      margin-top: 48px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--subtext-color);
      border-top: 1px solid var(--border-color);
      padding-top: 20px;
    }

    footer a {
      color: var(--text-color);
      text-decoration: underline;
      margin: 0 6px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-bar">
      <button id="lang-toggle" class="control-btn" type="button"></button>
      <button id="theme-toggle" class="control-btn" type="button"></button>
    </div>

    <header>
      <h1 id="header-title"></h1>
      <p id="subtext" class="subtext"></p>
    </header>

    <div id="info-box" class="info-box"></div>

    <div id="products" class="grid"></div>

    <div class="action-panel">
      <div class="order-header-row">
        <span id="order-label" class="order-label"></span>
        <span id="total-badge" class="total-badge"></span>
      </div>

      <textarea id="order-text" class="order-textarea keep-case" readonly></textarea>

      <div class="button-group">
        <button id="copy-btn" class="btn-copy" type="button"></button>
        <a id="threads-link" class="btn-threads" target="_blank" rel="noopener noreferrer"></a>
      </div>
    </div>

    <div class="payment-section">
      <h2 id="payment-title"></h2>
      <p id="payment-sub"></p>

      <div class="qr-container">
        <img src="qrcode.png" alt="payment qr code" />
      </div>

      <div class="bank-details">
        <div><strong id="lbl-holder"></strong> <span id="val-holder" class="keep-case"></span></div>
        <div><strong id="lbl-bank"></strong> <span id="val-bank" class="keep-case"></span></div>
        <div>
          <strong id="lbl-account"></strong>
          <span id="account-number" class="account-number"></span>
          <button id="copy-acc-btn" class="copy-small-btn" type="button"></button>
        </div>
      </div>
    </div>

    <footer>
      <p id="connect-text"></p>
      <p style="margin-top: 6px;">
        <a id="footer-threads" target="_blank" rel="noopener noreferrer"></a> •
        <a id="faq-link" rel="noopener"></a>
      </p>
    </footer>
  </div>

  <script>
    /* ------------------------------------------------------------
       CONFIG — edit prices, text, and payment details here only.
       ------------------------------------------------------------ */
    const CONFIG = {
      threadsUrl: "https://www.threads.net/@vincentphmd",
      faqUrl: "https://phamminhdung.tech",
      bank: {
        holder: "PHAM MINH DUNG",
        bankName: "vib",
        accountNumber: "607809"
      },
      products: [
        {
          id: "cardholder",
          price: 250000,
          image: "photo1.png",
          en: {
            title: "01 / minimalist cardholder",
            desc: "holds 4–6 cards plus folded cash. hand-stitched full grain leather."
          },
          vi: {
            title: "01 / ví đựng thẻ tối giản",
            desc: "sức chứa 4–6 thẻ và tiền gấp gọn. da tấm khâu tay thủ công."
          }
        },
        {
          id: "bifold",
          price: 380000,
          image: "photo2.png",
          en: {
            title: "02 / slim bifold wallet",
            desc: "classic bifold structure without the bulk. 6 card slots + full bill pocket."
          },
          vi: {
            title: "02 / ví gập slim bifold",
            desc: "kiểu gập cổ điển mỏng nhẹ. 6 ngăn thẻ + 1 ngăn tiền mặt."
          }
        },
        {
          id: "coin-sleeve",
          price: 290000,
          image: "photo3.png",
          en: {
            title: "03 / pocket coin & card sleeve",
            desc: "compact envelope style with snap button closure. fits coins, keys, and cards."
          },
          vi: {
            title: "03 / bao da khuy bấm đa năng",
            desc: "dạng phong bì nhỏ gọn. đựng thẻ, tiền xu hoặc chìa khóa."
          }
        }
      ]
    };

    const STRINGS = {
      en: {
        langBtn: "🇻🇳 vietnamese",
        themeToDark: "🌙 dark",
        themeToLight: "☀️ light",
        headerTitle: "handcrafted leather",
        subtext: "minimalist cardholders & wallets built to last.",
        infoLabel: "how to buy:",
        infoText: " tap multiple products below to select them. copy your generated message and send it to my threads inbox.",
        select: "select model",
        selected: "selected",
        orderLabel: "your order message (auto-updated):",
        total: "total:",
        copy: "📋 copy text",
        copied: "✓ copied!",
        copyAcc: "📋 copy",
        threadsBtn: "open threads dm ↗",
        msgHeader: "hi vincent, i would like to order:",
        msgTotal: "total price:",
        paymentTitle: "payment & bank info",
        paymentSub: "scan qr code or use bank details below for payment",
        holderLabel: "account holder:",
        bankLabel: "bank:",
        accountLabel: "account number:",
        connect: "connect with me:",
        threads: "threads",
        backFaq: "back to faq",
        noSelection: "please select at least one product.",
        altCardholder: "minimalist cardholder",
        altBifold: "slim bifold wallet",
        altCoin: "pocket coin & card sleeve",
        altQr: "payment qr code"
      },
      vi: {
        langBtn: "🇬🇧 english",
        themeToDark: "🌙 tối",
        themeToLight: "☀️ sáng",
        headerTitle: "đồ da thủ công",
        subtext: "ví & bóp đựng thẻ tối giản, thiết kế bền bỉ.",
        infoLabel: "cách mua hàng:",
        infoText: " bấm chọn nhiều sản phẩm bên dưới. sao chép tin nhắn tự tạo và gửi qua threads inbox.",
        select: "chọn mẫu",
        selected: "đã chọn",
        orderLabel: "tin nhắn đặt hàng (tự động cập nhật):",
        total: "tổng cộng:",
        copy: "📋 sao chép",
        copied: "✓ đã sao chép!",
        copyAcc: "📋 sao chép",
        threadsBtn: "mở threads dm ↗",
        msgHeader: "chào vincent, mình muốn đặt hàng:",
        msgTotal: "tổng chi phí:",
        paymentTitle: "thông tin chuyển khoản & qr",
        paymentSub: "quét mã qr hoặc chuyển khoản theo thông tin bên dưới",
        holderLabel: "chủ tài khoản:",
        bankLabel: "ngân hàng:",
        accountLabel: "số tài khoản:",
        connect: "kết nối với mình:",
        threads: "threads",
        backFaq: "quay lại faq",
        noSelection: "vui lòng chọn ít nhất một sản phẩm.",
        altCardholder: "ví đựng thẻ tối giản",
        altBifold: "ví gập slim bifold",
        altCoin: "bao da khuy bấm đa năng",
        altQr: "mã qr thanh toán"
      }
    };

    const state = {
      lang: "en",
      theme: "light",
      selected: new Set([0])
    };

    const el = (id) => document.getElementById(id);

    function formatVND(amount) {
      return amount.toLocaleString("en-US") + " vnd";
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function t() {
      return STRINGS[state.lang];
    }

    function renderProducts() {
      const s = t();
      const html = CONFIG.products.map((p, idx) => {
        const info = p[state.lang];
        const isSelected = state.selected.has(idx);
        const alt = [s.altCardholder, s.altBifold, s.altCoin][idx] || info.title;
        return `
          <div class="card${isSelected ? " selected" : ""}" data-index="${idx}">
            <img src="${escapeHtml(p.image)}" alt="${escapeHtml(alt)}" />
            <div class="card-content">
              <div class="card-title">${escapeHtml(info.title)}</div>
              <div class="card-desc">${escapeHtml(info.desc)}</div>
              <div class="card-price">${formatVND(p.price)}</div>
              <button class="select-btn" type="button">${isSelected ? s.selected : s.select}</button>
            </div>
          </div>`;
      }).join("");
      el("products").innerHTML = html;
    }

    function updateOrderText() {
      const s = t();
      const textarea = el("order-text");
      const badge = el("total-badge");

      if (state.selected.size === 0) {
        textarea.value = s.noSelection;
        badge.textContent = `${s.total} 0 vnd`;
        return;
      }

      let total = 0;
      const lines = [...state.selected]
        .sort((a, b) => a - b)
        .map((idx) => {
          const p = CONFIG.products[idx];
          total += p.price;
          return `- ${p[state.lang].title} (${formatVND(p.price)})`;
        });

      const formattedTotal = formatVND(total);
      badge.textContent = `${s.total} ${formattedTotal}`;
      textarea.value = `${s.msgHeader}\n${lines.join("\n")}\n${s.msgTotal} ${formattedTotal}`;
    }

    function toggleSelect(index) {
      if (state.selected.has(index)) {
        if (state.selected.size > 1) state.selected.delete(index);
      } else {
        state.selected.add(index);
      }
      renderProducts();
      updateOrderText();
    }

    function toggleTheme() {
      state.theme = state.theme === "light" ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", state.theme);
      renderStaticText();
    }

    function toggleLang() {
      state.lang = state.lang === "en" ? "vi" : "en";
      renderAll();
    }

    function copyToClipboard(text) {
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(text).catch(() => legacyCopy(text));
      }
      return Promise.resolve(legacyCopy(text));
    }

    function legacyCopy(text) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      let ok = false;
      try {
        ok = document.execCommand("copy");
      } catch (e) {
        ok = false;
      }
      document.body.removeChild(ta);
      if (!ok) throw new Error("copy failed");
    }

    const flashTimers = new WeakMap();

    function flashButton(btn, text, restore) {
      clearTimeout(flashTimers.get(btn));
      btn.textContent = text;
      const timer = setTimeout(() => {
        btn.textContent = restore();
        flashTimers.delete(btn);
      }, 2000);
      flashTimers.set(btn, timer);
    }

    function copyOrderText() {
      const btn = el("copy-btn");
      const text = el("order-text").value;
      copyToClipboard(text)
        .then(() => flashButton(btn, t().copied, () => t().copy))
        .catch(() => flashButton(btn, "✗ copy failed", () => t().copy));
    }

    function copyAccountNumber() {
      const btn = el("copy-acc-btn");
      const text = CONFIG.bank.accountNumber;
      copyToClipboard(text)
        .then(() => flashButton(btn, t().copied, () => t().copyAcc))
        .catch(() => flashButton(btn, "✗ copy failed", () => t().copyAcc));
    }

    function renderStaticText() {
      const s = t();
      document.documentElement.lang = state.lang === "vi" ? "vi" : "en";
      document.documentElement.setAttribute("data-lang", state.lang);

      el("lang-toggle").textContent = s.langBtn;
      el("theme-toggle").textContent = state.theme === "light" ? s.themeToDark : s.themeToLight;

      el("header-title").textContent = s.headerTitle;
      el("subtext").textContent = s.subtext;

      el("info-box").innerHTML = `<strong>${escapeHtml(s.infoLabel)}</strong>${escapeHtml(s.infoText)}`;

      el("order-label").textContent = s.orderLabel;
      el("copy-btn").textContent = flashTimers.has(el("copy-btn")) ? el("copy-btn").textContent : s.copy;
      el("copy-acc-btn").textContent = flashTimers.has(el("copy-acc-btn")) ? el("copy-acc-btn").textContent : s.copyAcc;
      el("threads-link").textContent = s.threadsBtn;
      el("threads-link").href = CONFIG.threadsUrl;

      el("payment-title").textContent = s.paymentTitle;
      el("payment-sub").textContent = s.paymentSub;
      el("lbl-holder").textContent = s.holderLabel;
      el("val-holder").textContent = CONFIG.bank.holder;
      el("lbl-bank").textContent = s.bankLabel;
      el("val-bank").textContent = CONFIG.bank.bankName;
      el("lbl-account").textContent = s.accountLabel;
      el("account-number").textContent = CONFIG.bank.accountNumber;

      el("connect-text").textContent = s.connect;
      el("footer-threads").textContent = s.threads;
      el("footer-threads").href = CONFIG.threadsUrl;
      el("faq-link").textContent = s.backFaq;
      el("faq-link").href = CONFIG.faqUrl;

      document.querySelector(".payment-section img").alt = s.altQr;
    }

    function renderAll() {
      renderStaticText();
      renderProducts();
      updateOrderText();
    }

    function init() {
      el("lang-toggle").addEventListener("click", toggleLang);
      el("theme-toggle").addEventListener("click", toggleTheme);
      el("copy-btn").addEventListener("click", copyOrderText);
      el("copy-acc-btn").addEventListener("click", copyAccountNumber);

      el("products").addEventListener("click", (e) => {
        const card = e.target.closest(".card");
        if (!card) return;
        toggleSelect(Number(card.dataset.index));
      });

      renderAll();
    }

    init();
  </script>
</body>
</html>
