<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>vincent leathercraft — catalog</title>
  <style>
    @font-face {
      font-family: "DINNextRoundedLTW01-Regular";
      src: url("/DINfont.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg-color: #a97954;       /* leather */
      --card-bg: #f6f2ea;       /* parchment */
      --text-color: #34000b;     /* crimson */
      --subtext-color: #532c2e;  /* binding */
      --border-color: #a97954;   /* oak */
      --info-bg: #f6f2ea;       /* parchment */
      --info-text: #532c2e;     /* binding */
      --btn-bg: #f6f2ea;        /* parchment */
      --btn-text: #532c2e;       /* binding */
      --btn-border: #a97954;     /* oak */
      --accent-bg: #532c2e;     /* binding */
      --accent-text: #f6f2ea;   /* parchment */
      --shadow-color: rgba(52, 0, 11, 0.15);
      --main-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    [data-lang="en"] {
      --main-font: "DINNextRoundedLTW01-Regular", -apple-system, BlinkMacSystemFont, sans-serif;
    }

    [data-theme="dark"] {
      --bg-color: #532c2e;       /* binding */
      --card-bg: #34000b;       /* crimson */
      --text-color: #f6f2ea;     /* parchment */
      --subtext-color: #f6f2ea;  /* leather */
      --border-color: #a97954;   /* oak */
      --info-bg: #34000b;       /* crimson */
      --info-text: #f6f2ea;     /* parchment */
      --btn-bg: #34000b;        /* crimson */
      --btn-text: #f6f2ea;       /* parchment */
      --btn-border: #a97954;     /* oak */
      --accent-bg: #c29b87;     /* leather */
      --accent-text: #34000b;   /* crimson */
      --shadow-color: rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0;
    }

    html {
      font-size: 16px;
    }

    /* Lowercase applied to UI elements, excluding user-copyable content */
    body,
    h1, h2, p, label, button, a, strong, span, div {
      text-transform: lowercase;
    }
    .keep-case {
      text-transform: none;
    }

    body {
      font-family: var(--main-font);
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 40px 20px;
      line-height: 1.6;
      overflow-x: clip;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    /* Hidden by default on touchscreens to prevent mobile Chrome GPU/paint lag */
    .lightbox,
    .page-dimmer,
    .hover-gallery {
      display: none;
    }

    .container {
      max-width: 920px;
      margin: 0 auto;
    }

    /* Sticky floating top bar */
    .top-bar {
      position: sticky;
      top: 16px;
      z-index: 25;
      display: flex;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 24px;
      pointer-events: none;
      transform: translateZ(0);
    }

    .top-bar > * {
      pointer-events: auto;
      box-shadow: 0 4px 12px var(--shadow-color);
    }

    .control-btn {
      font-family: inherit;
      background: var(--btn-bg);
      color: var(--text-color);
      border: 1px solid var(--btn-border);
      padding: 9px 16px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }

    .zoom-controls {
      display: inline-flex;
      align-items: stretch;
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
    }

    .zoom-btn {
      font-family: inherit;
      background: transparent;
      color: var(--text-color);
      border: none;
      padding: 9px 13px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      line-height: 1;
    }

    .zoom-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .zoom-reset {
      font-family: inherit;
      background: transparent;
      color: var(--text-color);
      border: none;
      border-left: 1px solid var(--btn-border);
      border-right: 1px solid var(--btn-border);
      padding: 9px 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      min-width: 54px;
      text-align: center;
    }

    header {
      margin-bottom: 28px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 16px;
    }

    h1 {
      font-size: clamp(1.6rem, 3vw, 2.05rem);
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .subtext {
      color: var(--subtext-color);
      font-size: 1rem;
      margin-top: 4px;
    }

    .info-box {
      background: var(--info-bg);
      padding: 14px 18px;
      font-size: 0.95rem;
      color: var(--info-text);
      margin-bottom: 32px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
      margin-bottom: 36px;
    }

    .card {
      position: relative;
      z-index: 1;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      overflow: visible;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      display: flex;
      flex-direction: column;
    }

    .card.selected {
      border-color: var(--text-color);
      box-shadow: 0 0 0 2px var(--text-color);
    }

    .card > img {
      width: 100%;
      aspect-ratio: 4 / 3;
      height: auto;
      object-fit: cover;
      display: block;
      background-color: var(--btn-bg);
    }

    .card-content {
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 600;
    }

    .card-desc {
      color: var(--subtext-color);
      font-size: 0.92rem;
      line-height: 1.55;
      margin-top: 6px;
      white-space: pre-line;
    }

    .card-price {
      font-weight: 700;
      margin-top: auto;
      padding-top: 14px;
      font-size: 1.05rem;
    }

    .select-btn {
      font-family: inherit;
      margin-top: 12px;
      width: 100%;
      padding: 10px;
      background: var(--btn-bg);
      color: var(--btn-text);
      border: 1px solid var(--btn-border);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }

    .card.selected .select-btn {
      background: var(--accent-bg);
      color: var(--accent-text);
      border-color: var(--accent-bg);
    }

    /* ── Desktop pointer-only hover gallery, dimmer & lightbox ── */
    @media (hover: hover) and (pointer: fine) and (min-width: 641px) {
      .lightbox {
        position: fixed;
        inset: 0;
        z-index: 200;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }

      .lightbox.active {
        display: flex;
      }

      .lightbox img {
        max-height: 55vh;
        max-width: 55vw;
        width: auto;
        height: auto;
        object-fit: contain;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.9);
        border: 2px solid rgba(255, 255, 255, 0.15);
        animation: lb-pop 0.2s cubic-bezier(0.22, 1, 0.36, 1);
        pointer-events: none;
      }

      @keyframes lb-pop {
        from { opacity: 0; transform: scale(0.88); }
        to   { opacity: 1; transform: scale(1); }
      }

      .page-dimmer {
        display: block;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.65);
        opacity: 0;
        pointer-events: none;
        z-index: 30;
        transition: opacity 0.45s ease 0.35s;
      }

      body:has(.card:hover) .page-dimmer,
      body.is-hovering-card .page-dimmer {
        opacity: 1;
        transition: opacity 0.4s ease 0s;
      }

      .card {
        transition: opacity 0.45s ease 0.35s, filter 0.45s ease 0.35s, border-color 0.3s ease, box-shadow 0.3s ease;
      }

      body:has(.card:hover) .card:not(:hover),
      body.is-hovering-card .card:not(:hover) {
        opacity: 0.28;
        filter: brightness(0.6);
        transition: opacity 0.4s ease 0s, filter 0.4s ease 0s, border-color 0.3s ease, box-shadow 0.3s ease;
      }

      .card:hover {
        z-index: 45;
        border-color: var(--text-color);
        box-shadow: 0 14px 36px rgba(0, 0, 0, 0.55);
        transition: opacity 0.3s ease 0s, filter 0.3s ease 0s, border-color 0.3s ease, box-shadow 0.3s ease;
      }

      .card.selected:hover {
        box-shadow: 0 0 0 2px var(--text-color), 0 14px 36px rgba(0, 0, 0, 0.55);
      }

      .hover-gallery {
        display: block;
        pointer-events: none;
      }

      .popup-shot {
        position: absolute;
        width: 265px;
        aspect-ratio: 4 / 3;
        background: var(--card-bg);
        border: 1px solid var(--text-color);
        padding: 5px;
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.65);
        opacity: 0;
        pointer-events: none;
        z-index: 50;
        transition: opacity 0.45s ease 0.35s, transform 0.45s cubic-bezier(0.22, 1, 0.36, 1) 0.35s, box-shadow 0.25s ease;
      }

      .popup-shot img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .card:nth-child(odd) .popup-shot-1 {
        top: -14px;
        right: calc(100% + 14px);
        transform: translateX(18px) scale(0.9);
      }
      .card:nth-child(odd) .popup-shot-2 {
        top: 50%;
        right: calc(100% + 26px);
        transform: translate(18px, -50%) scale(0.9);
        z-index: 51;
      }
      .card:nth-child(odd) .popup-shot-3 {
        bottom: -14px;
        right: calc(100% + 14px);
        transform: translateX(18px) scale(0.9);
      }

      .card:nth-child(even) .popup-shot-1 {
        top: -14px;
        left: calc(100% + 14px);
        transform: translateX(-18px) scale(0.9);
      }
      .card:nth-child(even) .popup-shot-2 {
        top: 50%;
        left: calc(100% + 26px);
        transform: translate(-18px, -50%) scale(0.9);
        z-index: 51;
      }
      .card:nth-child(even) .popup-shot-3 {
        bottom: -14px;
        left: calc(100% + 14px);
        transform: translateX(-18px) scale(0.9);
      }

      .card:hover .popup-shot {
        opacity: 1;
        pointer-events: auto;
      }

      .card:hover .popup-shot-1 {
        transform: translateX(0) scale(1);
        transition: opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1) 0s, transform 0.45s cubic-bezier(0.22, 1, 0.36, 1) 0s, box-shadow 0.25s ease;
      }
      .card:hover .popup-shot-2 {
        transform: translate(0, -50%) scale(1);
        transition: opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1) 0.08s, transform 0.45s cubic-bezier(0.22, 1, 0.36, 1) 0.08s, box-shadow 0.25s ease;
      }
      .card:hover .popup-shot-3 {
        transform: translateX(0) scale(1);
        transition: opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1) 0.16s, transform 0.45s cubic-bezier(0.22, 1, 0.36, 1) 0.16s, box-shadow 0.25s ease;
      }

      .card:hover .popup-shot-1:hover,
      .card:hover .popup-shot-3:hover {
        z-index: 60;
        transform: translateX(0) scale(1.08);
        box-shadow: 0 18px 42px rgba(0, 0, 0, 0.8);
        transition-delay: 0s;
      }
      .card:hover .popup-shot-2:hover {
        z-index: 60;
        transform: translate(0, -50%) scale(1.08);
        box-shadow: 0 18px 42px rgba(0, 0, 0, 0.8);
        transition-delay: 0s;
      }
    }

    @media (hover: hover) and (pointer: fine) and (max-width: 1499px) and (min-width: 641px) {
      .popup-shot {
        width: 245px;
      }

      .card:nth-child(odd) .popup-shot-1 {
        right: auto;
        left: calc(100% + 14px);
        transform: translateX(-18px) scale(0.9);
      }
      .card:nth-child(odd) .popup-shot-2 {
        right: auto;
        left: calc(100% + 24px);
        transform: translate(-18px, -50%) scale(0.9);
      }
      .card:nth-child(odd) .popup-shot-3 {
        right: auto;
        left: calc(100% + 14px);
        transform: translateX(-18px) scale(0.9);
      }

      .card:nth-child(even) .popup-shot-1 {
        left: auto;
        right: calc(100% + 14px);
        transform: translateX(18px) scale(0.9);
      }
      .card:nth-child(even) .popup-shot-2 {
        left: auto;
        right: calc(100% + 24px);
        transform: translate(18px, -50%) scale(0.9);
      }
      .card:nth-child(even) .popup-shot-3 {
        left: auto;
        right: calc(100% + 14px);
        transform: translateX(18px) scale(0.9);
      }

      .card:hover .popup-shot-1,
      .card:hover .popup-shot-3 {
        transform: translateX(0) scale(1);
      }
      .card:hover .popup-shot-2 {
        transform: translate(0, -50%) scale(1);
      }

      .card:hover .popup-shot-1:hover,
      .card:hover .popup-shot-3:hover {
        transform: translateX(0) scale(1.08);
      }
      .card:hover .popup-shot-2:hover {
        transform: translate(0, -50%) scale(1.08);
      }
    }

    .action-panel {
      position: sticky;
      bottom: 20px;
      z-index: 20;
      background: var(--card-bg);
      border: 1px solid var(--text-color);
      padding: 16px 20px;
      box-shadow: 0 10px 25px var(--shadow-color);
      margin-bottom: 40px;
      transform: translateZ(0);
    }

    .order-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      gap: 12px;
    }

    .order-label {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--subtext-color);
    }

    .total-badge {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-color);
      white-space: nowrap;
    }

    .order-textarea {
      width: 100%;
      height: 7rem;
      font-family: inherit;
      font-size: 0.92rem;
      line-height: 1.5;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      background: var(--btn-bg);
      color: var(--text-color);
      resize: none;
      margin-bottom: 12px;
      outline: none;
      text-transform: none;
    }

    .button-group {
      display: flex;
      gap: 10px;
    }

    .btn-copy {
      flex: 1;
      font-family: inherit;
      background: var(--btn-bg);
      color: var(--text-color);
      border: 1px solid var(--btn-border);
      padding: 12px 0;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      text-align: center;
    }

    .btn-threads {
      flex: 2;
      font-family: inherit;
      display: inline-block;
      background: var(--accent-bg);
      color: var(--accent-text);
      text-decoration: none;
      padding: 12px 0;
      font-weight: 600;
      font-size: 0.95rem;
      text-align: center;
    }

    .leather-note {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 20px 24px;
      margin-bottom: 32px;
    }

    .leather-note h2 {
      font-size: 1.15rem;
      margin-bottom: 10px;
    }

    .leather-note ul {
      padding-left: 18px;
      color: var(--subtext-color);
      font-size: 0.95rem;
      line-height: 1.7;
      text-transform: lowercase;
    }

    .leather-note li + li {
      margin-top: 8px;
    }

    .payment-section {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 24px;
      text-align: center;
      margin-bottom: 40px;
    }

    .payment-section h2 {
      font-size: 1.2rem;
      margin-bottom: 6px;
    }

    .payment-section > p {
      font-size: 0.95rem;
      color: var(--subtext-color);
      margin-bottom: 16px;
    }

    .qr-container img {
      width: 280px;
      height: 280px;
      max-width: 100%;
      object-fit: contain;
      border: 1px solid var(--border-color);
      background: #fff;
      padding: 8px;
      margin-bottom: 16px;
    }

    .bank-details {
      font-size: 0.95rem;
      line-height: 1.85;
      background: var(--info-bg);
      padding: 12px 18px;
      display: inline-block;
      text-align: left;
    }

    .copy-small-btn {
      font-family: inherit;
      background: var(--btn-bg);
      color: var(--text-color);
      border: 1px solid var(--btn-border);
      padding: 3px 9px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      margin-left: 6px;
      display: inline-block;
      vertical-align: middle;
    }

    .account-number {
      text-transform: none;
    }

    footer {
      margin-top: 48px;
      text-align: center;
      font-size: 0.9rem;
      color: var(--subtext-color);
      border-top: 1px solid var(--border-color);
      padding-top: 20px;
    }

    footer a {
      color: var(--text-color);
      text-decoration: underline;
      margin: 0 6px;
    }

    @media (max-width: 640px) {
      body {
        padding: 24px 14px;
      }

      .top-bar {
        top: 10px;
        gap: 8px;
      }

      .control-btn {
        padding: 8px 12px;
        font-size: 0.88rem;
      }

      .zoom-btn {
        padding: 8px 10px;
        font-size: 0.88rem;
      }

      .zoom-reset {
        padding: 8px 8px;
        font-size: 0.8rem;
        min-width: 46px;
      }

      .grid {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .action-panel {
        padding: 14px;
        bottom: 12px;
      }
    }
  </style>
</head>

        <button id="zoom-in" class="zoom-btn" type="button" aria-label="zoom in">🔍+</button>
      </div>
      <button id="lang-toggle" class="control-btn" type="button"></button>
      <button id="theme-toggle" class="control-btn" type="button"></button>

  </div>

    const STRINGS = {

        bankLabel: "ngân hàng:",
        accountLabel: "số tài khoản:",
        connect: "kết nối với mình:",
        threads: "threads",
        zalo: "zalo",
        youtube: "youtube",
        backFaq: "quay lại faq",
        noSelection: "vui lòng chọn ít nhất một sản phẩm.",
        altQr: "mã qr thanh toán"

    const ZOOM_LEVELS = [75, 85, 90, 100, 110, 120, 130, 145];
    const DEFAULT_ZOOM_INDEX = 3; // 100%
    const HAS_FINE_HOVER = window.matchMedia("(hover: hover) and (pointer: fine)").matches;

    const state = {
      lang: "en",
      theme: "light",
      zoomIndex: DEFAULT_ZOOM_INDEX,
      selected: new Set()
    };

    const el = (id) => document.getElementById(id);

    function formatVND(amount) {
      return amount.toLocaleString("en-US") + " vnd";
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function t() {
      return STRINGS[state.lang];
    }

    function renderProducts() {
      const s = t();
      const html = CONFIG.products.map((p, idx) => {
        const info = p[state.lang];
        const isSelected = state.selected.has(idx);
        const extrasHtml = HAS_FINE_HOVER
          ? (p.extraImages || [])
              .slice(0, 3)
              .map((src, shotIdx) => `
                <div class="popup-shot popup-shot-${shotIdx + 1}">
                  <img src="${escapeHtml(src)}" alt="${escapeHtml(info.title)} — view ${shotIdx + 1}" loading="lazy" decoding="async" />
                </div>`)
              .join("")
          : "";

        return `
          <div class="card${isSelected ? " selected" : ""}" data-index="${idx}">
            <img src="${escapeHtml(p.image)}" alt="${escapeHtml(info.title)}" decoding="async" />
            <div class="card-content">
              <div class="card-title">${escapeHtml(info.title)}</div>
              <div class="card-desc">${escapeHtml(info.desc)}</div>
              <div class="card-price">${formatVND(p.price)}</div>
              <button class="select-btn" type="button">${isSelected ? s.selected : s.select}</button>
            </div>
            ${extrasHtml ? `<div class="hover-gallery" aria-hidden="true">${extrasHtml}</div>` : ""}
          </div>`;
      }).join("");
      el("products").innerHTML = html;
    }

    function updateOrderText() {
      const s = t();
      const textarea = el("order-text");
      const badge = el("total-badge");

      if (state.selected.size === 0) {
        textarea.value = s.noSelection;
        badge.textContent = `${s.total} 0 vnd`;
        return;
      }

      let total = 0;
      const lines = [...state.selected]
        .sort((a, b) => a - b)
        .map((idx) => {
          const p = CONFIG.products[idx];
          total += p.price;
          return `- ${p[state.lang].title} (${formatVND(p.price)})`;
        });

      const formattedTotal = formatVND(total);
      badge.textContent = `${s.total} ${formattedTotal}`;
      textarea.value = `${s.msgHeader}\n${lines.join("\n")}\n${s.msgTotal} ${formattedTotal}`;
    }

    function toggleSelect(index) {
      if (state.selected.has(index)) {
        state.selected.delete(index);
      } else {
        state.selected.add(index);
      }

      const isSelected = state.selected.has(index);
      const card = el("products").querySelector(`.card[data-index="${index}"]`);
      if (card) {
        card.classList.toggle("selected", isSelected);
        const btn = card.querySelector(".select-btn");
        if (btn) btn.textContent = isSelected ? t().selected : t().select;
      }

      updateOrderText();
    }

    function applyZoom() {
      const pct = ZOOM_LEVELS[state.zoomIndex];
      document.documentElement.style.fontSize = (16 * (pct / 100)) + "px";
      renderStaticText();
    }

    function zoomOut() {
      if (state.zoomIndex > 0) {
        state.zoomIndex--;
        applyZoom();
      }
    }

    function zoomIn() {
      if (state.zoomIndex < ZOOM_LEVELS.length - 1) {
        state.zoomIndex++;
        applyZoom();
      }
    }

    function zoomReset() {
      state.zoomIndex = DEFAULT_ZOOM_INDEX;
      applyZoom();
    }

    function toggleTheme() {
      state.theme = state.theme === "light" ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", state.theme);
      renderStaticText();
    }

    function toggleLang() {
      state.lang = state.lang === "en" ? "vi" : "en";
      renderAll();
    }

    function copyToClipboard(text) {
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(text).catch(() => legacyCopy(text));
      }
      return Promise.resolve(legacyCopy(text));
    }

    function legacyCopy(text) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      let ok = false;
      try {
        ok = document.execCommand("copy");
      } catch (e) {
        ok = false;
      }
      document.body.removeChild(ta);
      if (!ok) throw new Error("copy failed");
    }

    const flashTimers = new WeakMap();

    function flashButton(btn, text, restore) {
      clearTimeout(flashTimers.get(btn));
      btn.textContent = text;
      const timer = setTimeout(() => {
        btn.textContent = restore();
        flashTimers.delete(btn);
      }, 2000);
      flashTimers.set(btn, timer);
    }

    function copyOrderText() {
      const btn = el("copy-btn");
      const text = el("order-text").value;
      copyToClipboard(text)
        .then(() => flashButton(btn, t().copied, () => t().copy))
        .catch(() => flashButton(btn, "✗ copy failed", () => t().copy));
    }

    function copyAccountNumber() {
      const btn = el("copy-acc-btn");
      const text = CONFIG.bank.accountNumber;
      copyToClipboard(text)
        .then(() => flashButton(btn, t().copied, () => t().copyAcc))
        .catch(() => flashButton(btn, "✗ copy failed", () => t().copyAcc));
    }

    function renderStaticText() {
      const s = t();
      document.documentElement.lang = state.lang === "vi" ? "vi" : "en";
      document.documentElement.setAttribute("data-lang", state.lang);

      el("zoom-reset").textContent = `${ZOOM_LEVELS[state.zoomIndex]}%`;
      el("zoom-out").disabled = state.zoomIndex === 0;
      el("zoom-in").disabled = state.zoomIndex === ZOOM_LEVELS.length - 1;

      el("lang-toggle").textContent = s.langBtn;
      el("theme-toggle").textContent = state.theme === "light" ? s.themeToDark : s.themeToLight;

      el("header-title").textContent = s.headerTitle;
      el("subtext").textContent = s.subtext;

      el("info-box").innerHTML = `<strong>${escapeHtml(s.infoLabel)}</strong>${escapeHtml(s.infoText)}`;

      el("order-label").textContent = s.orderLabel;
      el("copy-btn").textContent = flashTimers.has(el("copy-btn")) ? el("copy-btn").textContent : s.copy;
      el("copy-acc-btn").textContent = flashTimers.has(el("copy-acc-btn")) ? el("copy-acc-btn").textContent : s.copyAcc;
      el("threads-link").textContent = s.threadsBtn;
      el("threads-link").href = CONFIG.threadsUrl;

      el("leather-title").textContent = s.leatherTitle;
      el("leather-list").innerHTML = s.leatherNotes
        .map((note) => `<li>${escapeHtml(note)}</li>`)
        .join("");

      el("payment-title").textContent = s.paymentTitle;
      el("payment-sub").textContent = s.paymentSub;
      el("lbl-holder").textContent = s.holderLabel;
      el("val-holder").textContent = CONFIG.bank.holder;
      el("lbl-bank").textContent = s.bankLabel;
      el("val-bank").textContent = CONFIG.bank.bankName;
      el("lbl-account").textContent = s.accountLabel;
      el("account-number").textContent = CONFIG.bank.accountNumber;

      el("connect-text").textContent = s.connect;
      el("footer-threads").textContent = s.threads;
      el("footer-threads").href = CONFIG.threadsUrl;
      el("footer-zalo").textContent = s.zalo;
      el("footer-zalo").href = CONFIG.zaloUrl;
      el("footer-youtube").textContent = s.youtube;
      el("footer-youtube").href = CONFIG.youtubeUrl;
      el("faq-link").textContent = s.backFaq;
      el("faq-link").href = CONFIG.faqUrl;

      document.querySelector(".payment-section img").alt = s.altQr;
    }

    function renderAll() {
      renderStaticText();
      renderProducts();
      updateOrderText();
    }

    function init() {
      el("zoom-out").addEventListener("click", zoomOut);
      el("zoom-in").addEventListener("click", zoomIn);
      el("zoom-reset").addEventListener("click", zoomReset);
      el("lang-toggle").addEventListener("click", toggleLang);
      el("theme-toggle").addEventListener("click", toggleTheme);
      el("copy-btn").addEventListener("click", copyOrderText);
      el("copy-acc-btn").addEventListener("click", copyAccountNumber);

      const productsGrid = el("products");

      productsGrid.addEventListener("click", (e) => {
        const card = e.target.closest(".card");
        if (!card) return;
        toggleSelect(Number(card.dataset.index));
      });

      if (HAS_FINE_HOVER) {
        let hoverLeaveTimer = null;

        productsGrid.addEventListener("mouseover", (e) => {
          if (e.target.closest(".card")) {
            clearTimeout(hoverLeaveTimer);
            document.body.classList.add("is-hovering-card");
          }
        });

        productsGrid.addEventListener("mouseout", (e) => {
          const fromCard = e.target.closest(".card");
          const toCard = e.relatedTarget ? e.relatedTarget.closest(".card") : null;
          if (fromCard && !toCard) {
            hoverLeaveTimer = setTimeout(() => {
              document.body.classList.remove("is-hovering-card");
            }, 350);
          }
        });

        const lightbox = document.createElement("div");
        lightbox.className = "lightbox";
        lightbox.innerHTML = '<img id="lightbox-img" src="" alt="larger view" />';
        document.body.appendChild(lightbox);

        const lightboxImg = document.getElementById("lightbox-img");
        let lbHideTimer = null;

        document.addEventListener("mouseover", (e) => {
          const popupImg = e.target.closest(".popup-shot img");
          if (popupImg) {
            clearTimeout(lbHideTimer);
            lightboxImg.src = popupImg.src;
            lightbox.classList.add("active");
          }
        });

        document.addEventListener("mouseout", (e) => {
          const popupImg = e.target.closest(".popup-shot img");
          if (popupImg) {
            lbHideTimer = setTimeout(() => {
              lightbox.classList.remove("active");
            }, 120);
          }
        });
      }

      renderAll();
    }

    init();
  </script>
