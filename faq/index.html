<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>faq</title>
  <style>
    @font-face {
      font-family: "DIN";
      src: url("/DINfont.ttf") format("truetype");
      font-display: swap;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "DIN", "Segoe UI", sans-serif;
      background: #a97954;
      color: #34000b;
      min-height: 100vh;
      padding: 40px 20px;
      text-transform: lowercase;
      line-height: 1.6;
    }

    .card {
      max-width: 480px;
      margin: 0 auto;
      background: #f6f2ea;
      border: 1px solid #a97954;
      padding: 28px 24px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 20px;
      letter-spacing: -0.02em;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
    }

    tr { border-bottom: 1px solid rgba(52,0,11,0.12); }
    tr:last-child { border-bottom: none; }

    td { padding: 9px 0; vertical-align: top; }
    td:first-child { color: #532c2e; width: 55%; }
    td:last-child { font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <h1>faq</h1>
    <table>
      <tr><td>age</td><td>18</td></tr>
      <tr><td>birthday</td><td>aug 7</td></tr>
      <tr><td>where are you from?</td><td>vietnam</td></tr>
      <tr><td>height?</td><td>172 cm</td></tr>
      <tr><td>major</td><td>it</td></tr>
      <tr><td>orientation</td><td>straight</td></tr>
      <tr><td>mbti</td><td>(old) intp → infj-t</td></tr>
      <tr><td>fav food?</td><td>bun bo hue, oreo, grape</td></tr>
    </table>
  </div>
</body>
</html>
