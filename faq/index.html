<!doctype html>
<html lang="en">
  <head>

    <meta name="description" content="FAQ — personal details, interests, and links. Handcrafted leather shop by Vincent." />
    <title>FAQ</title>
    <link rel="stylesheet" href="/faq/style.css" />

    <main class="wrap">

            <li><span class="fact-label">age</span><span>18</span></li>
            <li><span class="fact-label">birthday</span><span>aug 7</span></li>
            <li><span class="fact-label">where are you from?</span><span>vietnam</span></li>
            <li><span class="fact-label">what's your height?</span><span>172 cm</span></li>
            <li><span class="fact-label">major</span><span>it</span></li>
            <li><span class="fact-label">orientation</span><span>straight</span></li>
            <li><span class="fact-label">what's your mbti</span><span>(old) intp → infj-t</span></li>
            <li><span class="fact-label">what's your fav food?</span><span>bun bo hue, oreo, grape</span></li>

        </div>

        <p class="thanks">thank you!</p>
      </section>
    </main>

</html>
